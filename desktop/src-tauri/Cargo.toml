[package]
name = "omnidesk"
version = "0.1.0"
description = "OmniDesk — your personal AI desk"
edition = "2021"
rust-version = "1.77"

[[bin]]
name = "omnidesk"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
